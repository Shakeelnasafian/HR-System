server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location ~ ^/(api(?:/|$)|sanctum(?:/|$)|user(?:/|$)|up$|login$|logout$|two-factor-challenge$|forgot-password$|reset-password$) {
        # GET SPA auth pages; POST auth requests always reach Laravel.
        error_page 418 = @spa;
        set $get_request "";
        if ($request_method = GET) { set $get_request 1; }
        if ($uri ~ ^/(login|forgot-password|reset-password)$) { set $get_request "${get_request}1"; }
        if ($get_request = 11) { return 418; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass api:9000;
    }
    location @spa { try_files /index.html =404; }
    location / { try_files $uri $uri/ /index.html; }
}
